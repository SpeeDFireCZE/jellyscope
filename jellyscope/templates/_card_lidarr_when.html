{# The Lidarr card "When imports happen": a grid of weekdays and hours.

   From the database (cards_lidarr.py, `d.heatmap_data` = 7 × 24, row 0 = Monday),
   times in the app's zone. #}
<div class="card">
    <div class="card-head">
        <h2>{{ prefix }}{{ _(card.name) }}</h2>
        <p class="card-note">{{ _("local time") }}</p>
    </div>
    {{ charts.heatmap(d.heatmap_data, unit='') | safe }}
</div>
