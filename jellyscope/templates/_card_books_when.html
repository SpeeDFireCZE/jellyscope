{# The books card "When people read and listen": hours by weekday and hour.

   From the database (cards_books.py, `d.heatmap_data` = 7 × 24, row 0 = Monday), times in the app's zone. #}
<div class="card">
    <div class="card-head">
        <h2>{{ prefix }}{{ _(card.name) }}</h2>
        <p class="card-note">{{ _("local time") }}</p>
    </div>
    {{ charts.heatmap(d.heatmap_data) | safe }}
</div>
