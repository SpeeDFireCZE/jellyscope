<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Jellyscope">
    <title>Jellyscope</title>
    <!--
        A sight with a bar chart inside.

        The ring and four ticks = the "scope" of the name: I look at one place
        and magnify it. The bars inside say what is in that viewfinder - data.

        The gradient from purple to blue is Jellyfin's brand gradient
        (#AA5CC3 -> #00A4DC). The logo thus claims what it builds on;
        the app's own chart colours deliberately have nothing to do with it.

        CAREFUL with the shape of the rim. I tried a variant where the ring is
        broken and arms run outwards from the ends of the arcs. That makes
        four hooks with rotational symmetry around the centre - and that is the
        structure of a swastika. So the ring stays continuous and the ticks are
        separate from it: four separate strokes have no rotational sense.

        It is drawn into a 64x64 square and is made entirely of circles, lines and
        rectangles, so it stays sharp at any size.
    -->
    <defs>
        <linearGradient id="js-brand" x1="8" y1="6" x2="56" y2="58"
                        gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#AA5CC3"/>
            <stop offset="1" stop-color="#00A4DC"/>
        </linearGradient>
    </defs>

    <g fill="none" stroke="url(#js-brand)" stroke-width="5" stroke-linecap="round">
        <!-- the viewfinder's continuous ring -->
        <circle cx="32" cy="32" r="19"/>
        <!-- four separate ticks outside the ring -->
        <path d="M32 2v6M32 56v6M2 32h6M56 32h6"/>
    </g>

    <!-- a bar chart inside: three rising bars on a common base -->
    <g fill="url(#js-brand)">
        <rect x="22.5" y="32" width="5" height="10" rx="2.5"/>
        <rect x="29.5" y="26" width="5" height="16" rx="2.5"/>
        <rect x="36.5" y="21" width="5" height="21" rx="2.5"/>
    </g>
</svg>
