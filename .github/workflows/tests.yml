# ---------------------------------------------------------------------------
# Test suite on every push and pull request.
#
# The tests are plain scripts, not pytest: each file sets up its own
# temporary database (JELLYSCOPE_HOME) and exits non-zero on failure. So
# the job just runs them one by one and collects the failures - the same
# thing you would do on your own machine.
#
# Two Python versions on purpose: 3.10 is the oldest one we support (see
# requirements.txt) and 3.13 is what most people will actually have. Bugs
# that only show up on one of them are exactly what a matrix is for.
# ---------------------------------------------------------------------------
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a dependency that goes bad on its own does not sit unnoticed
  # until the next commit. The tests touch no network, so this is cheap.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # Do not stop the other version as soon as one fails - knowing whether
      # it breaks on both is half the diagnosis.
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: |
          selhalo=0
          for soubor in tests/test_*.py; do
              echo "::group::$soubor"
              if python "$soubor"; then
                  echo "OK   $soubor"
              else
                  echo "::error file=$soubor::test suite failed"
                  selhalo=$((selhalo + 1))
              fi
              echo "::endgroup::"
          done
          echo "failed suites: $selhalo"
          exit $selhalo
