# ---------------------------------------------------------------------------
# Release. Spouští se na tag "v1.2.3".
#
# Postup je schválně v tomhle pořadí: nejdřív se ověří, že verze v kódu
# odpovídá tagu, pak projdou testy, a teprve potom vznikne vydání. Vydání,
# které neprošlo testy, je horší než žádné - lidé si ho stáhnou.
#
# Jak vydat novou verzi:
#
#   1. změň __version__ v jellyscope/__init__.py
#   2. přidej oddíl "## 1.2.3" do CHANGELOG.md
#   3. commitni  ("Release 1.2.3")
#   4. git tag v1.2.3 && git push --tags
#
# Poznámky k vydání se berou z CHANGELOG.md - z oddílu, který patří tomu
# tagu. Když tam žádný není, poskládá je GitHub z commitů: vydání s hrubými
# poznámkami je pořád lepší než vydání bez nich.
# ---------------------------------------------------------------------------
name: release

on:
  push:
    # Tag smí být "v1.2.3" i "1.2.3" - starší vydání mají "v",
    # novější ne.
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write   # bez toho vydání nevznikne

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # kvůli poznámkám z historie commitů

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Version in the code must match the tag
        run: |
          # Tohle je ta nejčastější chyba u vydávání: tag říká 1.2.3,
          # ale aplikace se pořád hlásí jako 1.2.2 - a hlídání verzí
          # pak lidem tvrdí, že mají novější verzi, než jaká vyšla.
          tag="${GITHUB_REF_NAME#v}"
          kod=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('jellyscope/__init__.py').read_text()).group(1))")
          echo "tag: $tag, v kódu: $kod"
          if [ "$tag" != "$kod" ]; then
              echo "::error::tag $tag neodpovídá __version__ $kod"
              exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: |
          selhalo=0
          for soubor in tests/test_*.py; do
              python "$soubor" > /dev/null || { echo "FAIL $soubor"; selhalo=$((selhalo + 1)); }
          done
          exit $selhalo

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Oddíl z CHANGELOG.md, který patří tomuhle tagu: od nadpisu
          # "## 1.2.3" po další nadpis "## ".
          verze="${GITHUB_REF_NAME#v}"
          awk -v hledany="## $verze" '
              $0 == hledany { ctu = 1; next }
              /^## / && ctu  { exit }
              ctu            { print }
          ' CHANGELOG.md > poznamky.md

          # Název vydání je popis tagu, když ho tag má:
          #
          #     git tag -a 1.4.4 -m "1.4.4 security and cleaning"
          #
          # Bez popisu zůstává jméno tagu. Díky tomu se dá vydání
          # pojmenovat při vydávání a nemusí se kvůli tomu sahat sem.
          titul=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          [ -n "$titul" ] || titul="$GITHUB_REF_NAME"
          echo "název vydání: $titul"
          
          if [ -s poznamky.md ]; then
              echo "poznámky z CHANGELOG.md, $(wc -l < poznamky.md) řádků"
              gh release create "$GITHUB_REF_NAME" \
                  --title "$titul" \
                  --notes-file poznamky.md
          else
              echo "::warning::CHANGELOG.md nemá oddíl pro $verze, beru commity"
              gh release create "$GITHUB_REF_NAME" \
                  --title "$titul" \
                  --generate-notes
          fi
