; ---------------------------------------------------------------------------
; Jellyscope under supervisord
;
; Save as:  /etc/supervisor/conf.d/jellyscope.conf
; Load it:  sudo supervisorctl reread && sudo supervisorctl update
;
; Assumes:
;   * the code in /opt/jellyscope
;   * a virtual environment in /opt/jellyscope/.venv
;   * a user `jellyscope` who owns the folder
;
; deploy/install.sh fills the user and the paths in for you and writes
; jellyscope.conf.ready - that one only needs copying into place.
; ---------------------------------------------------------------------------

[program:jellyscope]

; Full path to the python from the virtual environment. Not `python` or
; `python3` - supervisord starts no login shell, so it knows no PATH
; from .bashrc.
command=/opt/jellyscope/.venv/bin/python run.py

; Working directory. It has to be right: run.py is started relatively
; and the app derives its data/ folder from it.
directory=/opt/jellyscope

; Never run as root. The app reads other people's video files and talks
; over the network - if somebody got around it, let them have as few
; permissions as possible.
user=jellyscope

autostart=true
autorestart=true

; How many times in a row it may die within startsecs before supervisord
; gives up.
startsecs=10
startretries=3

; Shutdown: politely first (SIGTERM), so uvicorn can finish its requests
; and the collector can close any playback in progress. Only after 30 s
; the hard way.
stopsignal=TERM
stopwaitsecs=30

; Stop the processes the app started too (ffprobe, pg_dump). Without this
; they could be left hanging after a stop.
stopasgroup=true
killasgroup=true

; Time zone. The app groups "when do people watch" and daily totals by
; it - without it the server would count in UTC and the chart would not
; match the clock on the wall.
environment=TZ="Europe/Prague",PYTHONUNBUFFERED="1"

; Logs. We leave them to supervisord so they get rotated.
stdout_logfile=/opt/jellyscope/data/logs/out.log
stderr_logfile=/opt/jellyscope/data/logs/err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
